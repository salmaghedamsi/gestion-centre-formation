<div class="login-container">

  <!-- Partie gauche : Illustration -->
  <div class="left-side">
    <img src="/images/Formation-professionnelle.jpg" alt="Formation">
    <h1>Bienvenue !</h1>
    <p>
      Gérez facilement votre centre de formation
      avec une plateforme moderne et sécurisée.
    </p>
  </div>

  <!-- Partie droite : Formulaire -->
  <div class="right-side">
    <div class="login-card">

      <!-- Logo -->
      <div class="logo">
        <h2>Centre de Formation</h2>
        <span>Connectez-vous à votre espace</span>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <!-- Email -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <mat-icon matPrefix>email</mat-icon>
          <input matInput type="email" formControlName="email" placeholder="exemple@gmail.com">
        </mat-form-field>

        <!-- Password -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Mot de passe</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input matInput type="password" formControlName="password" placeholder="********">
        </mat-form-field>

      

        <div class="alert alert-danger py-2 small" *ngIf="erreur">
          {{ erreur }}
        </div>

        <!-- Button -->
        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="login-button"
          [disabled]="chargement">
          {{ chargement ? 'Connexion...' : 'Se connecter' }}
        </button>

      </form>

    </div>
  </div>

</div>
