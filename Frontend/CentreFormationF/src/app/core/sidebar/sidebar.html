<div class="d-flex" style="min-height: 100vh;">

  <nav *ngIf="afficherSidebar" class="d-flex flex-column bg-light p-3" style="width: 260px;">
    <span class="fs-5 fw-semibold mb-4 px-2">Centre Formation</span>

    <a routerLink="/students" routerLinkActive="active" class="nav-link-custom d-flex align-items-center gap-3 px-3 py-3 rounded mb-2 text-decoration-none text-dark">
      <i class="bi bi-people fs-5"></i>
      <span>Élèves</span>
    </a>
    <a routerLink="/enseignants" routerLinkActive="active" class="nav-link-custom d-flex align-items-center gap-3 px-3 py-3 rounded mb-2 text-decoration-none text-dark">
      <i class="bi bi-person-badge fs-5"></i>
      <span>Enseignants</span>
    </a>
    <a routerLink="/groups" routerLinkActive="active" class="nav-link-custom d-flex align-items-center gap-3 px-3 py-3 rounded mb-2 text-decoration-none text-dark">
      <i class="bi bi-diagram-3 fs-5"></i>
      <span>Groupes</span>
    </a>
    <a routerLink="/formations" routerLinkActive="active" class="nav-link-custom d-flex align-items-center gap-3 px-3 py-3 rounded mb-2 text-decoration-none text-dark">
      <i class="bi bi-book fs-5"></i>
      <span>Formations</span>
    </a>

    <div class="mt-auto pt-3 border-top">
      <div class="d-flex align-items-center gap-2 px-2 mb-2" *ngIf="nomUtilisateur">
        <div class="user-avatar">A</div>
        <span class="small fw-medium text-truncate">Admin</span>
      </div>
      <button class="nav-link-custom logout-btn d-flex align-items-center gap-3 px-3 py-3 rounded text-decoration-none border-0 bg-transparent w-100 text-start" (click)="logout()">
        <i class="bi bi-box-arrow-right fs-5"></i>
        <span>Déconnexion</span>
      </button>
    </div>

  </nav>

  <div class="d-flex flex-column flex-grow-1">

    <main class="flex-grow-1 p-4">
      <router-outlet></router-outlet>
    </main>

    <footer class="app-footer px-4 py-3" *ngIf="afficherSidebar">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <span class="footer-text">© {{ anneeCourante }} Centre Formation. Tous droits réservés.</span>
        <div class="d-flex gap-3">
          <a href="mailto:contact@centreformation.tn" class="footer-link">Contact</a>
          <a routerLink="/mentions-legales" class="footer-link">Mentions légales</a>
        </div>
      </div>
    </footer>

  </div>

</div>
